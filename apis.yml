  - url: graphql/envio-graphql.md
    type: GraphQL
- name: HyperSync REST API
  description: High-performance data retrieval layer offering up to 2,000x faster
    blockchain data access than standard JSON-RPC endpoints. Supports structured queries
    over logs, transactions, and traces across 100+ blockchain networks via REST endpoints.
    Available across Ethereum, Arbitrum, Optimism, Polygon, Base, Avalanche, and many
    more chains. Client SDKs available for Python, Rust, Node.js, and Go.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.envio.dev/docs/HyperSync/overview
  baseURL: https://eth.hypersync.xyz
  tags:
