aid: envio
name: Envio
description: Envio is a high-performance blockchain data indexing platform providing
  developers with the fastest and most flexible way to access on-chain data. Its core
  products — HyperIndex, HyperSync, and HyperRPC — enable real-time and historical
  indexing across 100+ EVM networks and beyond, exposing indexed smart contract events
  through auto-generated GraphQL APIs and a REST-based HyperSync data retrieval layer.
  Envio Cloud offers fully managed hosting with git-based deployments, zero-downtime
  rollbacks, and multi-region support.
