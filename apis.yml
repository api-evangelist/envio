apis:
- name: HyperIndex GraphQL API
  description: Auto-generated GraphQL API exposing indexed smart contract events from
    any EVM-compatible chain. HyperIndex processes on-chain events into queryable
    databases, supports multichain indexing from a single deployment, and handles
    real-time event streaming with sub-second latency and automatic blockchain reorganisation
    recovery.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.envio.dev/docs/HyperIndex/overview
  baseURL: https://envio.dev
