    url: https://docs.envio.dev/docs/HyperSync/overview
  - type: Authentication
    url: https://docs.envio.dev/docs/HyperSync/api-tokens
- name: HyperRPC JSON-RPC API
  description: Read-only JSON-RPC endpoint optimised for data-intensive operations,
    providing up to 5x performance improvement over standard node providers. Functions
    as a drop-in replacement for existing Ethereum JSON-RPC integrations while delivering
    significantly faster response times for historical and real-time data queries.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
